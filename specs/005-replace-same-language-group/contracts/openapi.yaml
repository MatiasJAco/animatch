openapi: 3.1.0
info:
  title: Animatch Groups contract (feature 005)
  version: "1.0.0"
  description: |
    Reference copy of the two Groups endpoints from
    specs/001-daily-anime-puzzles/contracts/openapi.yaml, updated for feature
    005-replace-same-language-group.

    This feature removes the same_language criterion from Groups and replaces it with
    same_source (shared anime source material, e.g. "Manga" or "Web novel"). The wire contract
    is unchanged: tiles carry only { key, kind, name } and the criterion is disclosed only on a
    hit or the ending miss. The only difference is the set of criterion `type` values the server
    can emit (research R-005, data-model §1).

servers:
  - url: /
    description: Same origin as the site.

paths:
  /api/daily/groups:
    get:
      operationId: getGroupsPuzzle
      summary: Today's Groups puzzle (payload unchanged by feature 005)
      description: |
        One deterministic puzzle per UTC day. The payload contains the 16 tiles (image kind + id
        derived from each tile key client-side, as in feature 002) and the mistake limit. The
        solution's criteria are never part of this response.
      responses:
        "200":
          description: The day's groups puzzle payload.
        "404":
          $ref: "#/components/responses/UnknownGame"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

  /api/daily/groups/attempt:
    post:
      operationId: submitGroupsAttempt
      summary: Resolve a four-tile proposal (shape unchanged by feature 005)
      description: |
        The client sends tileKeys, the foundGroups it already holds, and its missLog — evidence
        the server verifies against the stored solution (Constitution IV). A hit returns the
        group criterion and tileKeys; a miss below the limit returns only the overlap count; the
        ending miss (fifth mistake) returns the full groups mapping. The criterion's type can
        now be same_source; same_language is never emitted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tileKeys]
              properties:
                tileKeys:
                  type: array
                  items:
                    type: string
                  minItems: 4
                  maxItems: 4
                  description: The four tiles proposed as one group.
                foundGroups:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                  description: Already-found groups, presented as evidence.
                missLog:
                  type: array
                  items:
                    type: array
                    items:
                      type: string
                  description: Rejected proposals, presented as evidence.
      responses:
        "200":
          description: Attempt outcome; GroupsOutcome oneOf as in feature 001.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupsOutcome"
              examples:
                groupsHit:
                  summary: Correct group, criterion disclosed
                  value:
                    result: hit
                    tileKeys: ["c:1@a:9", "c:2@a:9", "c:3@a:9", "c:4@a:9"]
                    criterion: { type: same_anime, animeId: 9 }
                    remainingGroups: 3
                    state: in_progress
                groupsMiss:
                  summary: Wrong group, overlap hint only
                  value:
                    result: miss
                    tileKeys: ["c:1@a:9", "c:2@a:9", "c:9@a:1", "c:8@a:2"]
                    overlap: 2
                    remainingGroups: 4
                    state: in_progress
                groupsLost:
                  summary: Ending miss discloses every group, including the same_source group
                  value:
                    result: miss
                    tileKeys: ["c:1@a:9", "c:2@a:9", "c:9@a:1", "c:8@a:2"]
                    groups:
                      - keys: ["c:1@a:9", "c:2@a:9", "c:3@a:9", "c:4@a:9"]
                        criterion: { type: same_anime, animeId: 9 }
                      - keys: ["c:5@a:1", "c:6@a:1", "c:7@a:1", "c:8@a:1"]
                        criterion: { type: same_season, season: fall, year: 2026 }
                      - keys: ["c:9@a:2", "c:10@a:2", "c:11@a:2", "c:12@a:2"]
                        criterion: { type: same_source, source: Web novel }
                      - keys: ["c:13@a:4", "c:14@a:4", "c:15@a:4", "c:16@a:4"]
                        criterion: { type: same_voice_actor, personId: 9001 }
                    state: lost
        "400":
          $ref: "#/components/responses/InvalidAttempt"
        "404":
          $ref: "#/components/responses/UnknownGame"
        "503":
          $ref: "#/components/responses/DatabaseUnavailable"

components:
  responses:
    InvalidAttempt:
      description: A rejected proposal — wrong tile count, unknown key, duplicate, or an
        already-consumed tile. None of these change game state.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    UnknownGame:
      description: The game identifier is not one of the three v1 games.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    DatabaseUnavailable:
      description: The catalog or game store is unreachable.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  schemas:
    GroupsOutcome:
      oneOf:
        - type: object
          required: [result, tileKeys, criterion, remainingGroups, state]
          properties:
            result:
              type: string
              enum: [hit]
            criterion:
              allOf:
                - type: object
                  properties:
                    type:
                      type: string
                      enum: [same_anime, same_season, same_source, same_voice_actor]
                - type: object
                  properties:
                    animeId: { type: integer }
                    season: { type: string }
                    year: { type: integer }
                    source: { type: string }
                    personId: { type: integer }
              description: |
                The revealed shared fact. same_language is removed and can never be emitted.
                same_source carries the source material (criterion.source) and no animeId.
            state:
              type: string
              enum: [in_progress, won]
        - type: object
          required: [result, tileKeys, overlap, remainingGroups, state]
          properties:
            result:
              type: string
              enum: [miss]
            overlap:
              type: integer
            state:
              type: string
              enum: [in_progress]
        - type: object
          required: [result, tileKeys, groups, state]
          properties:
            result:
              type: string
              enum: [miss]
            groups:
              type: array
              items:
                type: object
                required: [keys, criterion]
                properties:
                  keys:
                    type: array
                    items:
                      type: string
                    minItems: 4
                    maxItems: 4
                  criterion:
                    type: object
            state:
              type: string
              enum: [lost]
      description: |
        hit carries the criterion; the lost miss carries the full groups mapping. Both shapes
        are exactly feature 001's contract — only the criterion type set changed.
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string